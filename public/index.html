<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weelyx</title>
  <meta name="description" content="Weelyx — bientôt en ligne.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235b4bff'/><path d='M7 10l4 12 5-9 5 9 4-12' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <style>
    :root {
      --bg: #f7f7fb; --fg: #16161d; --muted: #5d5d6e; --accent: #5b4bff; --line: #e4e4ee;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0e13; --fg: #f1f1f6; --muted: #9d9db0; --accent: #8a7dff; --line: #26262f; }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; padding: 24px 16px;
    }
    main { flex: 1; display: grid; place-content: center; text-align: center; gap: 20px; max-width: 560px; margin: 0 auto; }
    .logo { width: 56px; height: 56px; margin: 0 auto; }
    h1 { font-size: clamp(2.2rem, 7vw, 3.2rem); letter-spacing: -0.03em; line-height: 1.1; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); }
    .pill {
      justify-self: center; font-size: 0.85rem; padding: 4px 12px;
      border: 1px solid var(--line); border-radius: 999px; color: var(--muted);
    }
    .pill::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; }
    footer { text-align: center; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M7 10l4 12 5-9 5 9 4-12" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Weelyx<span>.</span></h1>
    <p>Nous préparons quelque chose. Revenez bientôt.</p>
    <span class="pill">En construction</span>
  </main>
  <footer>© 2026 Weelyx</footer>
</body>
</html>
